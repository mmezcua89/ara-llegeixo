<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escolta les vocals · ARA LLEGEIXO!</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #faf8f4;
    color: #333;
    display: flex;
    justify-content: center;
  }

  .activitat {
    width: min(950px, 92%);
    padding: 50px 20px;
    text-align: center;
  }

  h1 {
    color: #857251;
    font-size: clamp(30px, 5vw, 48px);
    margin: 0 0 10px;
  }

  .instruccio {
    font-size: 22px;
    margin: 0 0 45px;
  }

  .vocals {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 22px;
  }

  .vocal {
    width: 130px;
    height: 130px;
    border: 4px solid #857251;
    border-radius: 22px;
    background: white;
    color: #857251;
    font-size: 70px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s;
  }

  .vocal:hover,
  .vocal:focus {
    background: #857251;
    color: white;
    transform: scale(1.05);
    outline: none;
  }

  .vocal.activa {
    background: #857251;
    color: white;
    transform: scale(1.08);
  }

  .ajuda {
    margin-top: 40px;
    color: #666;
    font-size: 18px;
  }
</style>
</head>

<body>

<main class="activitat">

  <h1>Escolta les vocals</h1>

  <p class="instruccio">
    Prem una lletra i escolta.
  </p>

  <div class="vocals">

    <button class="vocal" onclick="escolta('a', this)">A</button>
    <button class="vocal" onclick="escolta('e', this)">E</button>
    <button class="vocal" onclick="escolta('i', this)">I</button>
    <button class="vocal" onclick="escolta('o', this)">O</button>
    <button class="vocal" onclick="escolta('u', this)">U</button>

  </div>

  <p class="ajuda">
    🔊 Escolta i repeteix.
  </p>

</main>

<script>
let audioActual = null;

function escolta(lletra, boto) {

  // Para cualquier audio que estuviera sonando
  if (audioActual) {
    audioActual.pause();
    audioActual.currentTime = 0;
  }

  // Quita el resaltado anterior
  document.querySelectorAll('.vocal')
    .forEach(b => b.classList.remove('activa'));

  // Resalta la vocal pulsada
  boto.classList.add('activa');

  // Reproduce nuestra grabación
  audioActual = new Audio(lletra + '.mp3');
  audioActual.play();

  // Cuando acaba, vuelve al estado normal
  audioActual.onended = () => {
    boto.classList.remove('activa');
  };
}
</script>

</body>
</html>
